<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Addon VXV — Mode réduit</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.tab{flex:1;min-height:34px;padding:0 4px;border:0;background:#2a1a10;color:#d9c39a;font:600 13px 'Pixelify Sans',sans-serif;box-shadow:0 0 0 2px #0d0912,inset 0 -3px 0 #1a0f08}
.ibtn{width:28px;height:28px;border:0;background:#3a2414;color:#f8e7c0;box-shadow:0 0 0 2px #0d0912,0 0 0 3px #8a5a2a;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 420px; height: 600px; position: relative; overflow: hidden; background: #120c18; box-shadow: inset 0 0 0 3px #0d0912, inset 0 0 0 7px #8a5a2a, inset 0 0 0 10px #0d0912; font-family: Manrope, sans-serif; color: #ece7f6">
  <div style="position: absolute; inset: 10px; display: flex; flex-direction: column; gap: 10px">
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px; background: #1a0f0a">
      <img src="/_blob/b2d2692afb3c794bbdca84d87038ac16" alt="" style="width: 24px; height: 24px; object-fit: cover; box-shadow: 0 0 0 2px #0d0912, 0 0 0 3px #a35cff">
      <span style="font-family: 'Pixelify Sans', sans-serif; font-weight: 700; font-size: 17px; letter-spacing: .06em">VXV</span>
      <span style="font-size: 11px; color: #c9a87a">mode réduit</span>
      <button class="ibtn" type="button" aria-label="Agrandir avec la taverne" style="margin-left: auto"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="1" y="1" width="12" height="2" fill="currentColor"></rect><rect x="1" y="11" width="12" height="2" fill="currentColor"></rect><rect x="1" y="1" width="2" height="12" fill="currentColor"></rect><rect x="11" y="1" width="2" height="12" fill="currentColor"></rect></svg></button>
      <button class="ibtn" type="button" aria-label="Fermer"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="0" y="0" width="3" height="3" fill="currentColor"></rect><rect x="3" y="3" width="3" height="3" fill="currentColor"></rect><rect x="6" y="6" width="3" height="3" fill="currentColor"></rect><rect x="9" y="9" width="3" height="3" fill="currentColor"></rect><rect x="9" y="0" width="3" height="3" fill="currentColor"></rect><rect x="6" y="3" width="3" height="3" fill="currentColor"></rect><rect x="3" y="6" width="3" height="3" fill="currentColor"></rect><rect x="0" y="9" width="3" height="3" fill="currentColor"></rect></svg></button>
    </div>
    <div role="tablist" aria-label="Onglets" style="display: flex; gap: 6px; padding: 0 2px">
      <button class="tab" type="button" role="tab" aria-selected="true" style="background: #4a2a6a; color: #fff; box-shadow: 0 0 0 2px #0d0912, inset 0 -3px 0 #f2c94c">Raid</button>
      <button class="tab" type="button" role="tab">Paris</button>
      <button class="tab" type="button" role="tab">Quêtes</button>
      <button class="tab" type="button" role="tab">Ranking</button>
      <button class="tab" type="button" role="tab" aria-label="Plus">…</button>
    </div>

    <div style="padding: 12px; background: #2a1030; box-shadow: 0 0 0 2px #0d0912, 0 0 0 4px #f2c94c; display: flex; flex-direction: column; gap: 4px">
      <b style="font-family: 'Pixelify Sans', sans-serif; font-size: 17px; color: #f2c94c">Tu as une SR sur le prochain boss</b>
      <span style="font-size: 13px; color: #e6d6f2">Boss 10 · Lame des Braises éternelles · SR+ 20</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-family: 'Pixelify Sans', sans-serif; font-size: 14px; color: #e0479e">Prochain boss · Boss 10</span>
      <sc-for list="{{loot}}" as="l" hint-placeholder-count="4">
        <div style="display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; background: #1a1222; box-shadow: 0 0 0 2px #0d0912">
          <span style="font-size: 13px; font-weight: 700; color: {{l.color}}">{{l.name}}</span>
          <span style="font-size: 12px; color: #c9c2ea">{{l.sr}}</span>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; display: flex; justify-content: space-between; padding: 8px 10px; background: #1a0f0a; font-size: 12px; color: #d9c39a">
      <span>Raid : 38 / 40 · 6 / 11 boss</span>
      <span>Synchro il y a 4 min</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":420,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      loot: [
        { name: 'Lame des Braises éternelles', color: '#c77dff', sr: 'SR : Kaelys (toi, +20), Elyra, Thessa' },
        { name: 'Bâton du Seigneur du feu', color: '#c77dff', sr: 'SR : Morgane' },
        { name: 'Cape de cendre vive', color: '#4da3ff', sr: 'Aucune SR · roll libre' },
        { name: 'Écaille du dragon noir', color: '#c77dff', sr: 'Hors SR · loot council' }
      ]
    };
  }
}
</script>
</body>
</html>
