name: CI

# Pull requests: tests, then a preview of the website. Main: tests, then the website in production.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy-web:
    name: Deploy website (${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    needs: tests
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VERCEL_CLI: vercel@55.0.0
      # Stable address of the latest preview, registered as a Discord OAuth redirect.
      TEST_ALIAS: vxv-web-test.vercel.app
    steps:
      - name: Check the Vercel token
        id: token
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::notice::No VERCEL_TOKEN secret yet: website deployment skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - name: Build and deploy
        if: steps.token.outputs.present == 'true'
        run: |
          production=""
          if [[ "$VERCEL_ENVIRONMENT" == "production" ]]; then production="--prod"; fi
          npx "$VERCEL_CLI" pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          npx "$VERCEL_CLI" build $production --token="$VERCEL_TOKEN"
          url=$(npx "$VERCEL_CLI" deploy --prebuilt $production --token="$VERCEL_TOKEN")
          if [[ "$VERCEL_ENVIRONMENT" == "preview" ]]; then
            npx "$VERCEL_CLI" alias set "$url" "$TEST_ALIAS" --token="$VERCEL_TOKEN"
            url="https://$TEST_ALIAS"
          fi
          echo "Website ($VERCEL_ENVIRONMENT): $url" >> "$GITHUB_STEP_SUMMARY"
