name: CI

# Pull requests: tests, then a preview of the website. Main: tests, then the website in production.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Explicit bash runs with pipefail: a failing Vercel command stops the step with its own error.
defaults:
  run:
    shell: bash

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy-web:
    name: Deploy website (${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }})
    needs: tests
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
      VERCEL_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      VERCEL_CLI: vercel@55.0.0
      # Stable address of the latest preview, registered as a Discord OAuth redirect.
      TEST_ALIAS: vxv-web-test.vercel.app
    steps:
      - name: Check the Vercel token
        id: token
        run: |
          if [[ -z "$VERCEL_TOKEN" ]]; then
            echo "::notice::No VERCEL_TOKEN secret yet: website deployment skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
      - if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.token.outputs.present == 'true'
        run: npm ci
      - name: Check the website configuration
        if: steps.token.outputs.present == 'true'
        run: |
          required=$(grep -oE '^[A-Z_]+=' apps/web/.env.example | tr -d '=' | sort)
          defined=$(npx "$VERCEL_CLI" env ls "$VERCEL_ENVIRONMENT" --format json --token="$VERCEL_TOKEN" | jq -r '.envs[].key' | sort -u)
          missing=$(comm -23 <(echo "$required") <(echo "$defined"))
          if [[ -n "$missing" ]]; then
            echo "::error::Missing $VERCEL_ENVIRONMENT variables in Vercel: $(echo $missing)"
            exit 1
          fi
      - name: Build and deploy
        if: steps.token.outputs.present == 'true'
        run: |
          production=""
          if [[ "$VERCEL_ENVIRONMENT" == "production" ]]; then production="--prod"; fi
          npx "$VERCEL_CLI" pull --yes --environment="$VERCEL_ENVIRONMENT" --token="$VERCEL_TOKEN"
          npx "$VERCEL_CLI" build $production --token="$VERCEL_TOKEN"
          url=$(npx "$VERCEL_CLI" deploy --prebuilt $production --token="$VERCEL_TOKEN")
          if [[ "$VERCEL_ENVIRONMENT" == "preview" ]]; then
            npx "$VERCEL_CLI" alias set "$url" "$TEST_ALIAS" --token="$VERCEL_TOKEN"
            url="https://$TEST_ALIAS"
          fi
          echo "Website ($VERCEL_ENVIRONMENT): $url" >> "$GITHUB_STEP_SUMMARY"
      # Discord sends every interaction to production: its commands follow the production code.
      - name: Register the Discord commands
        if: steps.token.outputs.present == 'true' && env.VERCEL_ENVIRONMENT == 'production'
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
          DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
        run: npm run register-commands -w @vxv/bot
