name: Deploy database

# Merging migrations or raid data into main deploys the test database.
# Production is deployed only by a manual run from main, choosing "production".
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**", "data/raids/**"]
  workflow_dispatch:
    inputs:
      target:
        description: Database to deploy
        type: choice
        options: [test, production]
        default: test

concurrency: deploy-database-${{ inputs.target || 'test' }}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Deploy ${{ inputs.target || 'test' }}
    needs: tests
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target || 'test' }}
      TEST_DATABASE_URL: ${{ secrets.SUPABASE_TEST_DB_URL }}
      PRODUCTION_DATABASE_URL: ${{ secrets.SUPABASE_PRODUCTION_DB_URL }}
    steps:
      - name: Production only from main
        if: env.TARGET == 'production' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Production is deployed from main only."
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0
      - name: Deploy
        run: |
          url="$TEST_DATABASE_URL"
          if [[ "$TARGET" == "production" ]]; then url="$PRODUCTION_DATABASE_URL"; fi
          if [[ -z "$url" ]]; then
            echo "::notice::No connection string for $TARGET yet: deployment skipped."
            exit 0
          fi
          tools/deploy-database.sh "$url"
